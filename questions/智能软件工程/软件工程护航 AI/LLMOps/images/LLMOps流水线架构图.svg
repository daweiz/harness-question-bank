<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">RAG 智能客服——LLMOps 流水线架构图</text>

  <!-- 环形主流程容器 -->
  <rect x="50" y="120" width="560" height="420" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="330" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">LLMOps 工程化闭环流水线</text>

  <!-- ① 开发与版本管理 -->
  <rect x="70" y="162" width="220" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">① 开发 · 资产版本管理</text>
  <text x="180" y="210" text-anchor="middle" font-size="12" fill="#4b5563">提示词 / 模型 / 知识库 / 评估集</text>
  <text x="180" y="230" text-anchor="middle" font-size="12" fill="#4b5563">全部纳入 Git + 提示词注册表</text>
  <text x="180" y="250" text-anchor="middle" font-size="12" fill="#4b5563">知识工程：清洗 · 分块 · 索引</text>
  <text x="180" y="270" text-anchor="middle" font-size="12" fill="#4b5563">变更走评审 / 审批流程</text>

  <line x1="290" y1="222" x2="380" y2="222" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ② 评估 -->
  <rect x="382" y="162" width="208" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="486" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">② 离线评估</text>
  <text x="486" y="210" text-anchor="middle" font-size="12" fill="#4b5563">黄金集 + 自动化评测</text>
  <text x="486" y="230" text-anchor="middle" font-size="12" fill="#4b5563">正确性 · 忠实度 · 有害性</text>
  <text x="486" y="250" text-anchor="middle" font-size="12" fill="#4b5563">多模型 / 多提示版本对比</text>
  <text x="486" y="270" text-anchor="middle" font-size="12" fill="#4b5563">门槛不达标则拦截发布</text>

  <!-- ③ 发布 -->
  <line x1="486" y1="282" x2="486" y2="326" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="382" y="330" width="208" height="120" rx="8" fill="#e7f6ec" stroke="#16a34a" stroke-width="1.5"/>
  <text x="486" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">③ 发布上线</text>
  <text x="486" y="378" text-anchor="middle" font-size="12" fill="#4b5563">金丝雀 / 灰度发布</text>
  <text x="486" y="398" text-anchor="middle" font-size="12" fill="#4b5563">Prompt 灰度 · 流控与降级</text>
  <text x="486" y="418" text-anchor="middle" font-size="12" fill="#4b5563">影子模式对账（新旧对比）</text>
  <text x="486" y="438" text-anchor="middle" font-size="12" fill="#4b5563">异常自动回滚</text>

  <!-- ④ 监控 -->
  <line x1="486" y1="450" x2="330" y2="330" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="330" x2="180" y2="330" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="70" y="330" width="220" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">④ 线上监控 · 漂移检测</text>
  <text x="180" y="378" text-anchor="middle" font-size="12" fill="#4b5563">输入分布 / 检索质量</text>
  <text x="180" y="398" text-anchor="middle" font-size="12" fill="#4b5563">成本 / 延迟 / 安全护栏指标</text>
  <text x="180" y="418" text-anchor="middle" font-size="12" fill="#4b5563">幻觉与知识过期检测</text>
  <text x="180" y="438" text-anchor="middle" font-size="12" fill="#4b5563">漂移触发告警与重评估</text>

  <!-- ⑤ 反馈 -->
  <line x1="180" y1="450" x2="180" y2="282" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <rect x="70" y="462" width="520" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="330" y="484" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">⑤ 反馈闭环</text>
  <text x="330" y="504" text-anchor="middle" font-size="12" fill="#4b5563">线上反馈回流 → 数据标注 → 调提示词 / 重训练 → 回归评估 → 再发布</text>

  <!-- 右侧：治理与质量保障 -->
  <rect x="630" y="120" width="250" height="250" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="755" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b21a8">AI 治理 · 质量保障横切</text>
  <text x="755" y="176" text-anchor="middle" font-size="12" fill="#4b5563">内容安全护栏（拒答 / 脱敏）</text>
  <text x="755" y="198" text-anchor="middle" font-size="12" fill="#4b5563">成本配额与预算控制</text>
  <text x="755" y="220" text-anchor="middle" font-size="12" fill="#4b5563">隐私合规（PII 检测）</text>
  <text x="755" y="242" text-anchor="middle" font-size="12" fill="#4b5563">可观测性：全链路追踪</text>
  <text x="755" y="264" text-anchor="middle" font-size="12" fill="#4b5563">模型卡 / 评估报告留档</text>
  <text x="755" y="286" text-anchor="middle" font-size="12" fill="#4b5563">审计日志与决策留痕</text>

  <line x1="590" y1="160" x2="630" y2="160" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="590" y1="280" x2="630" y2="280" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="610" y="222" font-size="11" fill="#9333ea" text-anchor="middle">横切约束</text>

  <!-- 底部：关键指标 -->
  <rect x="50" y="548" width="830" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="465" y="572" text-anchor="middle" font-size="13" fill="#1f2937">关键指标：用户满意度 · 首答延迟 · 单次成本 · 检索命中率 · 幻觉率 · 护栏拦截率 · 漂移告警数</text>
</svg>
