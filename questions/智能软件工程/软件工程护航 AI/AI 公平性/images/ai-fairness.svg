<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>

  <text x="480" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">AI 系统公平性保障框架（全生命周期）</text>

  <!-- 治理与审计层 -->
  <rect x="60" y="56" width="840" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="80" font-size="14" font-weight="bold" text-anchor="middle" fill="#5b21b6">治理与审计层：公平性政策与目标 · 风险评估 · 责任分工</text>
  <text x="480" y="100" font-size="13" text-anchor="middle" fill="#5b21b6">独立审计 · 监管合规 · 问责机制</text>

  <!-- 数据层 -->
  <rect x="60" y="170" width="190" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="155" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">1 数据层 Data</text>
  <text x="80" y="224" font-size="13" fill="#334155">采集覆盖度偏差</text>
  <text x="80" y="248" font-size="13" fill="#334155">标注一致性审查</text>
  <text x="80" y="272" font-size="13" fill="#334155">敏感属性识别</text>
  <text x="80" y="296" font-size="13" fill="#334155">代表性审计</text>

  <!-- 模型层 -->
  <rect x="280" y="170" width="190" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="375" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">2 模型层 Model</text>
  <text x="300" y="224" font-size="13" fill="#334155">特征选择与偏置</text>
  <text x="300" y="248" font-size="13" fill="#334155">公平性约束优化</text>
  <text x="300" y="272" font-size="13" fill="#334155">公平性正则化</text>
  <text x="300" y="296" font-size="13" fill="#334155">可解释性支持</text>

  <!-- 评估层 -->
  <rect x="500" y="170" width="190" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="595" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">3 评估层 Evaluate</text>
  <text x="520" y="224" font-size="13" fill="#334155">统计均等指标</text>
  <text x="520" y="248" font-size="13" fill="#334155">机会均等指标</text>
  <text x="520" y="272" font-size="13" fill="#334155">公平性测试用例</text>
  <text x="520" y="296" font-size="13" fill="#334155">分群体性能对比</text>

  <!-- 部署与监控层 -->
  <rect x="720" y="170" width="190" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="815" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">4 部署与监控层</text>
  <text x="740" y="224" font-size="13" fill="#334155">线上公平性监控</text>
  <text x="740" y="248" font-size="13" fill="#334155">数据漂移检测</text>
  <text x="740" y="272" font-size="13" fill="#334155">投诉反馈回流</text>
  <text x="740" y="296" font-size="13" fill="#334155">定期再评估</text>

  <!-- 阶段间箭头 -->
  <line x1="250" y1="245" x2="274" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="245" x2="494" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="245" x2="714" y2="245" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 持续反馈与再训练闭环 -->
  <path d="M 815 320 L 815 376 L 155 376 L 155 324" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="368" font-size="13" text-anchor="middle" fill="#475569">持续反馈与再训练闭环</text>

  <!-- 度量指标 -->
  <rect x="60" y="412" width="840" height="48" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="480" y="442" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f766e">公平性度量指标：统计均等 Demographic Parity · 机会均等 Equalized Odds · 个体公平 Individual Fairness</text>

  <!-- 缓解策略 -->
  <rect x="60" y="476" width="840" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="506" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">缓解策略：数据重采样 / 再权重 · 算法约束与正则化 · 后处理阈值校准</text>

  <!-- 底部说明 -->
  <rect x="60" y="540" width="840" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="480" y="568" font-size="13" text-anchor="middle" fill="#334155">度量与缓解贯穿数据—模型—评估—部署各阶段，各层接受治理层审计，形成持续改进闭环</text>
</svg>
