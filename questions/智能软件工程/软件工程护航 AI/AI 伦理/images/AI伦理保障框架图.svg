<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <text x="480" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">AI 系统伦理保障框架图（医疗 AI 辅助诊断）</text>

  <!-- 伦理原则层 -->
  <rect x="40" y="52" width="880" height="86" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="78" font-size="14" font-weight="bold" text-anchor="middle" fill="#5b21b6">伦理原则层（核心价值，贯穿全生命周期）</text>
  <text x="480" y="104" font-size="13" text-anchor="middle" fill="#6d28d9">以人为本 · 有益非恶意 · 公平公正 · 透明可解释 · 隐私保护 · 责任与问责</text>
  <text x="480" y="126" font-size="12" text-anchor="middle" fill="#7c3aed">人类自主性：AI 辅助决策，医生与患者保留最终决定权</text>

  <line x1="480" y1="138" x2="480" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 生命周期保障层 -->
  <rect x="40" y="154" width="880" height="196" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="480" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">全生命周期保障层（数据 → 模型 → 部署 → 交互）</text>

  <rect x="60" y="194" width="200" height="140" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="160" y="218" font-size="13" font-weight="bold" text-anchor="middle" fill="#075985">1 数据层</text>
  <text x="78" y="244" font-size="12" fill="#334155">患者知情同意</text>
  <text x="78" y="266" font-size="12" fill="#334155">数据质量与代表性</text>
  <text x="78" y="288" font-size="12" fill="#334155">隐私脱敏与合规</text>
  <text x="78" y="310" font-size="12" fill="#334155">去标识化存储</text>

  <rect x="273" y="194" width="200" height="140" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="373" y="218" font-size="13" font-weight="bold" text-anchor="middle" fill="#075985">2 模型层</text>
  <text x="291" y="244" font-size="12" fill="#334155">偏见检测与公平性审计</text>
  <text x="291" y="266" font-size="12" fill="#334155">可解释性机制（SHAP 等）</text>
  <text x="291" y="288" font-size="12" fill="#334155">误诊率分群体评估</text>
  <text x="291" y="310" font-size="12" fill="#334155">伦理阈值门禁</text>

  <rect x="486" y="194" width="200" height="140" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="586" y="218" font-size="13" font-weight="bold" text-anchor="middle" fill="#075985">3 部署与监控层</text>
  <text x="504" y="244" font-size="12" fill="#334155">临床环境持续监测</text>
  <text x="504" y="266" font-size="12" fill="#334155">分布漂移检测</text>
  <text x="504" y="288" font-size="12" fill="#334155">伦理风险预警</text>
  <text x="504" y="310" font-size="12" fill="#334155">决策留痕与责任追溯</text>

  <rect x="699" y="194" width="200" height="140" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="799" y="218" font-size="13" font-weight="bold" text-anchor="middle" fill="#075985">4 用户交互层</text>
  <text x="717" y="244" font-size="12" fill="#334155">AI 输出如实告知</text>
  <text x="717" y="266" font-size="12" fill="#334155">医生辅助决策界面</text>
  <text x="717" y="288" font-size="12" fill="#334155">人工复核与最终决定</text>
  <text x="717" y="310" font-size="12" fill="#334155">透明说明与反馈通道</text>

  <!-- 阶段间箭头 -->
  <line x1="260" y1="264" x2="268" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="473" y1="264" x2="481" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="686" y1="264" x2="694" y2="264" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="480" y1="350" x2="480" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 治理机制层 -->
  <rect x="40" y="366" width="880" height="140" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="480" y="392" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f766e">治理机制层（保障与问责）</text>

  <rect x="60" y="404" width="200" height="86" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="160" y="432" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f766e">伦理审查委员会</text>
  <text x="160" y="456" font-size="12" text-anchor="middle" fill="#0f766e">立项与上线伦理评审</text>
  <text x="160" y="476" font-size="12" text-anchor="middle" fill="#0f766e">争议处置与决策</text>

  <rect x="273" y="404" width="200" height="86" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="373" y="432" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f766e">算法影响评估</text>
  <text x="373" y="456" font-size="12" text-anchor="middle" fill="#0f766e">上线前伦理风险清单</text>
  <text x="373" y="476" font-size="12" text-anchor="middle" fill="#0f766e">高风险场景分级管控</text>

  <rect x="486" y="404" width="200" height="86" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="586" y="432" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f766e">审计与问责</text>
  <text x="586" y="456" font-size="12" text-anchor="middle" fill="#0f766e">决策日志与责任追溯</text>
  <text x="586" y="476" font-size="12" text-anchor="middle" fill="#0f766e">供应商与院方共责</text>

  <rect x="699" y="404" width="200" height="86" rx="6" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="799" y="432" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f766e">政策合规与持续改进</text>
  <text x="799" y="456" font-size="12" text-anchor="middle" fill="#0f766e">遵循监管与行业标准</text>
  <text x="799" y="476" font-size="12" text-anchor="middle" fill="#0f766e">公众参与与反馈闭环</text>

  <!-- 底部说明 -->
  <rect x="40" y="524" width="880" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="480" y="552" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">约束关系：伦理原则自上而下约束全生命周期各层；治理机制提供审查、评估、审计与问责</text>
  <text x="480" y="576" font-size="12" text-anchor="middle" fill="#334155">交互层的「人工复核与决定权」是伦理底线，部署层的反馈回流驱动数据与模型持续改进，形成闭环</text>
</svg>
