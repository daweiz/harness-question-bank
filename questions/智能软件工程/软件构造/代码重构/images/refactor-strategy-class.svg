<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="600" fill="#ffffff"/>
  <line x1="515" y1="20" x2="515" y2="580" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 左侧：重构前 -->
  <text x="24" y="44" font-size="16" font-weight="bold" fill="#b91c1c">重构前：坏味道</text>

  <rect x="70" y="80" width="380" height="250" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="70" y="80" width="380" height="32" rx="6" fill="#fee2e2"/>
  <text x="260" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">BillingService</text>
  <line x1="70" y1="112" x2="450" y2="112" stroke="#b91c1c" stroke-width="1"/>
  <text x="80" y="134" font-size="12" font-family="Consolas, Courier New, monospace" fill="#7f1d1d">+ calculatePrice(Order): BigDecimal</text>
  <line x1="70" y1="144" x2="450" y2="144" stroke="#b91c1c" stroke-width="1"/>
  <text x="80" y="162" font-size="11" font-family="Consolas, Courier New, monospace" fill="#334155">if (customerType == 普通) {</text>
  <text x="92" y="180" font-size="11" font-family="Consolas, Courier New, monospace" fill="#334155">if (有优惠券) { 折扣… }</text>
  <text x="92" y="198" font-size="11" font-family="Consolas, Courier New, monospace" fill="#334155">else if (满减) { … }</text>
  <text x="80" y="216" font-size="11" font-family="Consolas, Courier New, monospace" fill="#334155">} else if (会员) { 9 折… }</text>
  <text x="80" y="234" font-size="11" font-family="Consolas, Courier New, monospace" fill="#334155">} else if (企业) { 返点… }</text>
  <text x="80" y="252" font-size="11" font-family="Consolas, Courier New, monospace" fill="#b91c1c">运费逻辑（与运费模块重复）</text>
  <text x="80" y="276" font-size="11" font-family="Consolas, Courier New, monospace" fill="#b91c1c">新增规则 → 需改多处（霰弹式）</text>
  <text x="80" y="318" font-size="11" fill="#64748b">// 方法体超过 300 行，多职责混杂</text>

  <rect x="70" y="360" width="380" height="150" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.2"/>
  <text x="82" y="386" font-size="13" font-weight="bold" fill="#c2410c">识别出的坏味道：</text>
  <text x="82" y="412" font-size="12" fill="#7c2d12">① 长方法：&gt;300 行，计费/折扣/优惠券/运费混在一处</text>
  <text x="82" y="436" font-size="12" fill="#7c2d12">② 重复代码：折扣/运费逻辑与运费模块重复</text>
  <text x="82" y="460" font-size="12" fill="#7c2d12">③ 依恋情结：规则依赖 customerType 字段散落各分支</text>
  <text x="82" y="484" font-size="12" fill="#7c2d12">④ 霰弹式修改：新增一种规则需改动多处</text>

  <!-- 右侧：重构后 -->
  <text x="540" y="44" font-size="16" font-weight="bold" fill="#15803d">重构后：策略模式</text>

  <!-- BillingService -->
  <rect x="550" y="90" width="160" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="550" y="90" width="160" height="26" rx="6" fill="#dcfce7"/>
  <text x="630" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">BillingService</text>
  <line x1="550" y1="116" x2="710" y2="116" stroke="#16a34a" stroke-width="1"/>
  <text x="630" y="136" text-anchor="middle" font-size="11" font-family="Consolas, Courier New, monospace" fill="#14532d">+ calculatePrice()</text>
  <text x="630" y="152" text-anchor="middle" font-size="10" fill="#14532d">不再写 if-else</text>

  <!-- interface PriceStrategy -->
  <rect x="730" y="90" width="290" height="70" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="730" y="90" width="290" height="26" rx="6" fill="#dcfce7"/>
  <text x="875" y="109" text-anchor="middle" font-size="13" font-style="italic" font-weight="bold" fill="#14532d">«interface» PriceStrategy</text>
  <line x1="730" y1="116" x2="1020" y2="116" stroke="#16a34a" stroke-width="1"/>
  <text x="875" y="136" text-anchor="middle" font-size="12" font-family="Consolas, Courier New, monospace" fill="#14532d">+ calc(Order): BigDecimal</text>
  <text x="875" y="154" text-anchor="middle" font-size="10" fill="#14532d">统一计费入口，行为可替换</text>

  <line x1="710" y1="125" x2="730" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="716" y="118" font-size="10" fill="#475569">使用</text>

  <!-- 三个策略实现 -->
  <rect x="550" y="230" width="150" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="550" y="230" width="150" height="26" rx="6" fill="#dcfce7"/>
  <text x="625" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">NormalStrategy</text>
  <line x1="550" y1="256" x2="700" y2="256" stroke="#16a34a" stroke-width="1"/>
  <text x="625" y="278" text-anchor="middle" font-size="11" fill="#14532d">普通价 × 1.0</text>
  <text x="625" y="296" text-anchor="middle" font-size="10" fill="#14532d">满减 / 优惠券</text>

  <rect x="730" y="230" width="150" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="730" y="230" width="150" height="26" rx="6" fill="#dcfce7"/>
  <text x="805" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">MemberStrategy</text>
  <line x1="730" y1="256" x2="880" y2="256" stroke="#16a34a" stroke-width="1"/>
  <text x="805" y="278" text-anchor="middle" font-size="11" fill="#14532d">会员价 85 折</text>
  <text x="805" y="296" text-anchor="middle" font-size="10" fill="#14532d">叠加会员券</text>

  <rect x="910" y="230" width="150" height="80" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="910" y="230" width="150" height="26" rx="6" fill="#dcfce7"/>
  <text x="985" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">EnterpriseStrategy</text>
  <line x1="910" y1="256" x2="1060" y2="256" stroke="#16a34a" stroke-width="1"/>
  <text x="985" y="278" text-anchor="middle" font-size="11" fill="#14532d">企业返点计价</text>
  <text x="985" y="296" text-anchor="middle" font-size="10" fill="#14532d">合同折扣</text>

  <!-- 实现（虚线向上） -->
  <line x1="625" y1="230" x2="770" y2="160" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <line x1="805" y1="230" x2="805" y2="160" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <line x1="985" y1="230" x2="985" y2="160" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>

  <!-- 简单工厂 -->
  <rect x="550" y="370" width="500" height="80" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="800" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">PriceStrategyFactory（简单工厂）</text>
  <text x="800" y="418" text-anchor="middle" font-size="12" font-family="Consolas, Courier New, monospace" fill="#92400e">+ create(customerType): PriceStrategy</text>
  <text x="800" y="438" text-anchor="middle" font-size="11" fill="#92400e">新增类型 → 工厂登记，BillingService 零改动（开闭原则）</text>

  <!-- 创建（虚线向上） -->
  <line x1="625" y1="370" x2="625" y2="310" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="805" y1="370" x2="805" y2="310" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="985" y1="370" x2="985" y2="310" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- 底部实施步骤 -->
  <text x="540" y="510" font-size="12" fill="#334155">实施步骤：① 行为基线测试 → ② 提取接口 → ③ 提取策略类 → ④ 工厂替换 → ⑤ 去重 → ⑥ 清理</text>
  <text x="540" y="532" font-size="12" fill="#334155">每一步「重构 + 运行测试」，全程保持行为不变、测试全绿。</text>
</svg>
