<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="700" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">需求验证流程设计示意图</text>

  <!-- 流程步骤（左列） -->
  <rect x="60" y="60" width="320" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="220" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">输入：需求规格说明书（初稿）</text>
  <text x="220" y="102" text-anchor="middle" font-size="12" fill="#3730a3">功能需求 · 非功能需求 · 约束</text>

  <path d="M 220 114 L 220 148" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="216,146 220,152 224,146" fill="#94a3b8"/>

  <rect x="60" y="150" width="320" height="54" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="220" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e7490">静态检查</text>
  <text x="220" y="192" text-anchor="middle" font-size="12" fill="#155e75">完整性 · 一致性 · 可验证性 · 无二义性</text>

  <path d="M 220 204 L 220 238" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="216,236 220,242 224,236" fill="#94a3b8"/>

  <rect x="60" y="240" width="320" height="54" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="220" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">需求评审</text>
  <text x="220" y="282" text-anchor="middle" font-size="12" fill="#14532d">走查 / 正式审查 · 利益相关方参与</text>

  <path d="M 220 294 L 220 328" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="216,326 220,332 224,326" fill="#94a3b8"/>

  <rect x="60" y="330" width="320" height="54" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="220" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">原型验证</text>
  <text x="220" y="372" text-anchor="middle" font-size="12" fill="#9a3412">界面原型 / 可执行原型 · 用户确认</text>

  <path d="M 220 384 L 220 418" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="216,416 220,422 224,416" fill="#94a3b8"/>

  <rect x="60" y="420" width="320" height="54" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/>
  <text x="220" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#86198f">可跟踪性矩阵验证</text>
  <text x="220" y="462" text-anchor="middle" font-size="12" fill="#701a75">业务目标 ↔ 需求 ↔ 用例 ↔ 测试用例</text>

  <path d="M 220 474 L 220 478" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="216,476 220,482 224,476" fill="#94a3b8"/>

  <!-- 判定菱形 -->
  <polygon points="90,540 220,480 350,540 220,600" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="220" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">验证判定</text>
  <text x="220" y="558" text-anchor="middle" font-size="12" fill="#a16207">重大缺陷 = 0</text>
  <text x="220" y="576" text-anchor="middle" font-size="12" fill="#a16207">且缺陷密度 ≤ 阈值？</text>

  <!-- 是 → 形成基线 -->
  <path d="M 350 540 L 408 540" stroke="#22c55e" stroke-width="2"/>
  <polygon points="406,536 412,540 406,544" fill="#22c55e"/>
  <text x="376" y="530" font-size="13" font-weight="bold" fill="#15803d">是</text>

  <rect x="410" y="510" width="300" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="536" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">通过：形成需求基线</text>
  <text x="560" y="558" text-anchor="middle" font-size="12" fill="#14532d">纳入需求管理，进入设计与开发</text>

  <!-- 否 → 返工 -->
  <path d="M 220 600 L 220 636" stroke="#ef4444" stroke-width="2"/>
  <polygon points="216,634 220,640 224,634" fill="#ef4444"/>
  <text x="232" y="622" font-size="13" font-weight="bold" fill="#b91c1c">否</text>

  <rect x="60" y="640" width="320" height="46" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="668" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">不通过：返工修订 → 重新验证</text>

  <!-- 返工 → 回到静态检查（虚线回环） -->
  <path d="M 60 663 L 22 663 L 22 177 L 56 177" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="56,173 56,181 64,177" fill="#ef4444"/>
  <text x="12" y="420" font-size="12" fill="#b91c1c" transform="rotate(-90 14 420)">未通过回归</text>

  <!-- 右侧判定准则 -->
  <rect x="410" y="60" width="300" height="330" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">验证结果判定准则</text>
  <line x1="430" y1="102" x2="690" y2="102" stroke="#f59e0b" stroke-width="1"/>
  <text x="430" y="128" font-size="12" fill="#92400e">• 静态检查：无冲突、无二义、可验证</text>
  <text x="430" y="152" font-size="12" fill="#92400e">• 需求评审：重大缺陷为 0</text>
  <text x="430" y="176" font-size="12" fill="#92400e">• 原型验证：关键流程获用户确认</text>
  <text x="430" y="200" font-size="12" fill="#92400e">• 跟踪矩阵：目标/用例全覆盖，无孤儿</text>
  <text x="430" y="224" font-size="12" fill="#92400e">• 缺陷密度 ≤ 阈值（如每页 ≤ 1 个主要缺陷）</text>
  <text x="430" y="248" font-size="12" fill="#92400e">• 遗留问题有明确责任人与处理期限</text>
  <text x="430" y="280" font-size="12" font-weight="bold" fill="#b45309">满足全部准则方可形成需求基线，</text>
  <text x="430" y="300" font-size="12" font-weight="bold" fill="#b45309">否则返工修订并重新验证。</text>
</svg>
