<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" font-family="SimHei, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- 提出变更申请 -->
  <rect x="20" y="90" width="130" height="50" rx="6" fill="#eaf4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="85" y="119" text-anchor="middle" fill="#1a3d5c">提出变更申请</text>
  <!-- 变更影响分析 -->
  <rect x="195" y="90" width="130" height="50" rx="6" fill="#eaf4fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="260" y="119" text-anchor="middle" fill="#1a3d5c">变更影响分析</text>
  <!-- CCB 评审决策 -->
  <rect x="370" y="90" width="130" height="50" rx="6" fill="#fff3cd" stroke="#d69e2e" stroke-width="2"/>
  <text x="435" y="111" text-anchor="middle" fill="#7c5e00" font-weight="bold">CCB 评审决策</text>
  <text x="435" y="128" text-anchor="middle" fill="#7c5e00" font-size="11">（批准 / 拒绝）</text>
  <!-- 批准分支 -->
  <rect x="545" y="20" width="130" height="50" rx="6" fill="#eafaf0" stroke="#38a169" stroke-width="1.5"/>
  <text x="610" y="49" text-anchor="middle" fill="#205b36">实施变更</text>
  <rect x="720" y="20" width="130" height="50" rx="6" fill="#eafaf0" stroke="#38a169" stroke-width="1.5"/>
  <text x="785" y="49" text-anchor="middle" fill="#205b36">更新需求基线</text>
  <rect x="830" y="170" width="70" height="40" rx="6" fill="#eafaf0" stroke="#38a169" stroke-width="1.5"/>
  <text x="865" y="194" text-anchor="middle" fill="#205b36" font-size="11">验证与回归</text>
  <!-- 拒绝分支 -->
  <rect x="545" y="170" width="130" height="40" rx="6" fill="#fdecec" stroke="#c53030" stroke-width="1.5"/>
  <text x="610" y="194" text-anchor="middle" fill="#7b2020">关闭变更请求</text>
  <!-- 箭头：申请→影响分析 -->
  <line x1="150" y1="115" x2="192" y2="115" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头：影响分析→CCB -->
  <line x1="325" y1="115" x2="367" y2="115" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头：CCB→批准（向下到实施变更） -->
  <path d="M470,140 L470,45 L542,45" fill="none" stroke="#38a169" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="506" y="38" text-anchor="middle" fill="#38a169" font-size="11">批准</text>
  <!-- 箭头：CCB→拒绝（向下到关闭） -->
  <path d="M420,140 L420,190 L542,190" fill="none" stroke="#c53030" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="180" text-anchor="middle" fill="#c53030" font-size="11">拒绝</text>
  <!-- 箭头：实施变更→更新基线 -->
  <line x1="675" y1="45" x2="717" y2="45" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 箭头：更新基线→验证与回归（折线） -->
  <path d="M785,70 L785,190 L827,190" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
