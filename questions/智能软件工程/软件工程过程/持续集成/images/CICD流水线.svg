<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="920" height="280" fill="#ffffff"/>
  <text x="460" y="30" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">CI/CD 流水线：从提交到发布的全自动验证链路</text>

  <!-- 阶段 -->
  <g>
    <rect x="12" y="70" width="100" height="60" rx="8" fill="#3b82f6"/>
    <text x="62" y="104" font-size="13" fill="#ffffff" text-anchor="middle">代码提交</text>
    <rect x="126" y="70" width="100" height="60" rx="8" fill="#3b82f6"/>
    <text x="176" y="104" font-size="13" fill="#ffffff" text-anchor="middle">构建</text>
    <rect x="240" y="70" width="100" height="60" rx="8" fill="#3b82f6"/>
    <text x="290" y="104" font-size="13" fill="#ffffff" text-anchor="middle">单元测试</text>
    <rect x="354" y="70" width="100" height="60" rx="8" fill="#3b82f6"/>
    <text x="404" y="104" font-size="13" fill="#ffffff" text-anchor="middle">集成测试</text>
    <rect x="468" y="70" width="100" height="60" rx="8" fill="#8b5cf6"/>
    <text x="518" y="104" font-size="13" fill="#ffffff" text-anchor="middle">静态扫描</text>
    <rect x="582" y="70" width="100" height="60" rx="8" fill="#8b5cf6"/>
    <text x="632" y="104" font-size="13" fill="#ffffff" text-anchor="middle">打包</text>
    <rect x="696" y="70" width="100" height="60" rx="8" fill="#f59e0b"/>
    <text x="746" y="104" font-size="13" fill="#ffffff" text-anchor="middle">部署暂存</text>
    <rect x="810" y="70" width="100" height="60" rx="8" fill="#10b981"/>
    <text x="860" y="104" font-size="13" fill="#ffffff" text-anchor="middle">生产发布</text>
  </g>

  <!-- 阶段间箭头 -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M 112 100 L 126 100" marker-end="url(#b)"/>
    <path d="M 226 100 L 240 100" marker-end="url(#b)"/>
    <path d="M 340 100 L 354 100" marker-end="url(#b)"/>
    <path d="M 454 100 L 468 100" marker-end="url(#b)"/>
    <path d="M 568 100 L 582 100" marker-end="url(#b)"/>
    <path d="M 682 100 L 696 100" marker-end="url(#b)"/>
    <path d="M 796 100 L 810 100" marker-end="url(#b)"/>
  </g>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 范围标注 -->
  <line x1="12" y1="140" x2="582" y2="140" stroke="#3b82f6" stroke-width="2"/>
  <rect x="130" y="152" width="300" height="26" rx="6" fill="#dbeafe"/>
  <text x="280" y="170" font-size="13" fill="#1d4ed8" text-anchor="middle">持续集成 CI：频繁合并 + 自动构建与测试</text>
  <line x1="696" y1="140" x2="910" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <rect x="660" y="152" width="230" height="26" rx="6" fill="#fef3c7"/>
  <text x="775" y="170" font-size="13" fill="#b45309" text-anchor="middle">持续交付/部署 CD</text>

  <!-- 反馈回路 -->
  <path d="M 860 130 L 860 210 L 62 210 L 62 130" stroke="#10b981" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <text x="460" y="232" font-size="13" fill="#059669" text-anchor="middle">任一环节失败即反馈给团队，阻塞本次发布，实现快速迭代</text>
</svg>
