<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>

  <text x="480" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Scrum 框架：角色、事件与工件</text>

  <!-- 三个核心角色 -->
  <text x="480" y="58" font-size="14" font-weight="bold" text-anchor="middle" fill="#475569">三个核心角色</text>
  <rect x="120" y="68" width="200" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="220" y="96" font-size="15" text-anchor="middle" fill="#075985">产品负责人 Product Owner</text>
  <rect x="380" y="68" width="200" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="480" y="96" font-size="15" text-anchor="middle" fill="#075985">Scrum Master 敏捷教练</text>
  <rect x="640" y="68" width="200" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="740" y="96" font-size="15" text-anchor="middle" fill="#075985">开发团队 Developer Team</text>

  <line x1="40" y1="132" x2="920" y2="132" stroke="#cbd5e1" stroke-width="1"/>

  <text x="480" y="158" font-size="14" font-weight="bold" text-anchor="middle" fill="#475569">Sprint 迭代循环（事件与工件）</text>

  <!-- 产品待办列表 -->
  <rect x="24" y="240" width="150" height="88" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="99" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">产品待办列表</text>
  <text x="99" y="290" font-size="11" text-anchor="middle" fill="#334155">Product Backlog</text>
  <text x="99" y="310" font-size="12" text-anchor="middle" fill="#334155">需求与模型需求清单</text>

  <!-- 冲刺计划会 -->
  <rect x="200" y="240" width="150" height="88" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="275" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">冲刺计划会</text>
  <text x="275" y="292" font-size="11" text-anchor="middle" fill="#334155">拆解冲刺目标与任务</text>
  <text x="275" y="312" font-size="11" text-anchor="middle" fill="#334155">确定验收标准</text>

  <!-- Sprint 容器 -->
  <rect x="376" y="180" width="204" height="216" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="478" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#047857">Sprint 冲刺周期（2-4 周）</text>
  <rect x="392" y="210" width="172" height="42" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="478" y="226" font-size="13" text-anchor="middle" fill="#065f46">每日站会 Daily Scrum</text>
  <text x="478" y="242" font-size="10" text-anchor="middle" fill="#065f46">同步进度与阻碍</text>
  <rect x="392" y="262" width="172" height="42" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="478" y="279" font-size="13" text-anchor="middle" fill="#065f46">开发与测试</text>
  <text x="478" y="295" font-size="10" text-anchor="middle" fill="#065f46">实现功能与模型迭代</text>
  <rect x="392" y="314" width="172" height="58" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="478" y="334" font-size="13" text-anchor="middle" fill="#065f46">持续集成 / 持续交付</text>
  <text x="478" y="352" font-size="10" text-anchor="middle" fill="#065f46">CI/CD 自动化门禁</text>

  <!-- 冲刺评审会 -->
  <rect x="606" y="240" width="150" height="88" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="681" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">冲刺评审会</text>
  <text x="681" y="292" font-size="11" text-anchor="middle" fill="#334155">展示增量并验收</text>
  <text x="681" y="312" font-size="11" text-anchor="middle" fill="#334155">干系人反馈</text>

  <!-- 增量/发布 -->
  <rect x="782" y="240" width="154" height="88" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="859" y="270" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">增量 / 发布</text>
  <text x="859" y="292" font-size="11" text-anchor="middle" fill="#334155">Increment</text>
  <text x="859" y="312" font-size="11" text-anchor="middle" fill="#334155">可运行产品增量</text>

  <!-- 冲刺回顾会 -->
  <rect x="400" y="500" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="527" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">冲刺回顾会 Retrospective</text>
  <text x="500" y="546" font-size="11" text-anchor="middle" fill="#92400e">过程改进与改进项</text>

  <!-- 箭头：产品待办 -> 计划会 -->
  <line x1="174" y1="284" x2="196" y2="284" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 箭头：计划会 -> Sprint -->
  <line x1="350" y1="284" x2="372" y2="284" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 箭头：Sprint -> 评审会 -->
  <line x1="580" y1="284" x2="602" y2="284" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 箭头：评审会 -> 增量/发布 -->
  <line x1="756" y1="284" x2="778" y2="284" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 箭头：增量 -> 回顾会 -->
  <path d="M 859 328 L 859 530 L 604 530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="556" font-size="12" text-anchor="middle" fill="#475569">迭代反馈</text>
  <!-- 箭头：回顾会 -> 产品待办 -->
  <path d="M 400 530 L 99 530 L 99 332" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="556" font-size="12" text-anchor="middle" fill="#475569">改进项回填产品待办列表</text>
</svg>
