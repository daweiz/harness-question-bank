<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="920" height="620" fill="#ffffff"/>
  <text x="460" y="30" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">瀑布模型实施设计：阶段活动 · 阶段产物 · 评审关口 · 里程碑</text>

  <!-- 列标题 -->
  <text x="150" y="58" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">阶段与关键活动</text>
  <text x="430" y="58" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">阶段产物（文档）</text>
  <text x="680" y="58" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">评审关口</text>
  <text x="852" y="58" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">里程碑</text>

  <!-- 行1 需求分析 -->
  <rect x="60" y="70" width="200" height="64" rx="8" fill="#2563eb"/>
  <text x="160" y="90" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">需求分析</text>
  <text x="160" y="108" font-size="10.5" fill="#dbeafe" text-anchor="middle">访谈/问卷获取、原型确认</text>
  <text x="160" y="124" font-size="10.5" fill="#dbeafe" text-anchor="middle">编写需求规格、确认基线</text>
  <rect x="300" y="70" width="260" height="64" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="430" y="100" font-size="12" fill="#374151" text-anchor="middle">《需求规格说明书》</text>
  <text x="430" y="120" font-size="11" fill="#6b7280" text-anchor="middle">需求评审后冻结为需求基线</text>
  <rect x="610" y="70" width="130" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="675" y="98" font-size="12" fill="#92400e" text-anchor="middle">G1 需求评审</text>
  <text x="675" y="118" font-size="10.5" fill="#92400e" text-anchor="middle">干系人签字</text>
  <rect x="796" y="70" width="106" height="64" rx="8" fill="#1e3a8a"/>
  <text x="849" y="98" font-size="11" fill="#ffffff" text-anchor="middle">M1</text>
  <text x="849" y="118" font-size="10.5" fill="#dbeafe" text-anchor="middle">需求基线</text>
  <line x1="160" y1="134" x2="160" y2="158" stroke="#6b7280" stroke-width="2"/>
  <polygon points="160,164 155,156 165,156" fill="#6b7280"/>

  <!-- 行2 概要设计 -->
  <rect x="60" y="168" width="200" height="64" rx="8" fill="#2563eb"/>
  <text x="160" y="188" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">概要设计</text>
  <text x="160" y="206" font-size="10.5" fill="#dbeafe" text-anchor="middle">模块划分、接口定义</text>
  <text x="160" y="222" font-size="10.5" fill="#dbeafe" text-anchor="middle">架构选型与技术栈</text>
  <rect x="300" y="168" width="260" height="64" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="430" y="198" font-size="12" fill="#374151" text-anchor="middle">《概要设计文档》</text>
  <text x="430" y="218" font-size="11" fill="#6b7280" text-anchor="middle">模块图与接口清单</text>
  <rect x="610" y="168" width="130" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="675" y="196" font-size="12" fill="#92400e" text-anchor="middle">G2 设计评审</text>
  <text x="675" y="216" font-size="10.5" fill="#92400e" text-anchor="middle">架构/接口评审</text>
  <rect x="796" y="168" width="106" height="64" rx="8" fill="#1e3a8a"/>
  <text x="849" y="196" font-size="11" fill="#ffffff" text-anchor="middle">M2</text>
  <text x="849" y="216" font-size="10.5" fill="#dbeafe" text-anchor="middle">设计基线</text>
  <line x1="160" y1="232" x2="160" y2="256" stroke="#6b7280" stroke-width="2"/>
  <polygon points="160,262 155,254 165,254" fill="#6b7280"/>

  <!-- 行3 详细设计 -->
  <rect x="60" y="266" width="200" height="64" rx="8" fill="#2563eb"/>
  <text x="160" y="286" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">详细设计</text>
  <text x="160" y="304" font-size="10.5" fill="#dbeafe" text-anchor="middle">类设计、算法与数据设计</text>
  <text x="160" y="320" font-size="10.5" fill="#dbeafe" text-anchor="middle">伪代码与接口细化</text>
  <rect x="300" y="266" width="260" height="64" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="430" y="296" font-size="12" fill="#374151" text-anchor="middle">《详细设计文档》</text>
  <text x="430" y="316" font-size="11" fill="#6b7280" text-anchor="middle">类图/时序图/数据库设计</text>
  <rect x="610" y="266" width="130" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="675" y="294" font-size="12" fill="#92400e" text-anchor="middle">G3 详细设计评审</text>
  <text x="675" y="314" font-size="10.5" fill="#92400e" text-anchor="middle">细化可编码程度</text>
  <text x="849" y="300" font-size="10.5" fill="#9ca3af" text-anchor="middle">（延续 M2）</text>
  <line x1="160" y1="330" x2="160" y2="354" stroke="#6b7280" stroke-width="2"/>
  <polygon points="160,360 155,352 165,352" fill="#6b7280"/>

  <!-- 行4 编码实现 -->
  <rect x="60" y="364" width="200" height="64" rx="8" fill="#2563eb"/>
  <text x="160" y="384" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">编码实现</text>
  <text x="160" y="402" font-size="10.5" fill="#dbeafe" text-anchor="middle">按编码规范实现、自测</text>
  <text x="160" y="418" font-size="10.5" fill="#dbeafe" text-anchor="middle">单元测试与静态检查</text>
  <rect x="300" y="364" width="260" height="64" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="430" y="394" font-size="12" fill="#374151" text-anchor="middle">《源代码 + 单元测试》</text>
  <text x="430" y="414" font-size="11" fill="#6b7280" text-anchor="middle">规范符合、测试通过</text>
  <rect x="610" y="364" width="130" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="675" y="392" font-size="12" fill="#92400e" text-anchor="middle">G4 代码走查</text>
  <text x="675" y="412" font-size="10.5" fill="#92400e" text-anchor="middle">人工/AI 辅助审查</text>
  <rect x="796" y="364" width="106" height="64" rx="8" fill="#1e3a8a"/>
  <text x="849" y="392" font-size="11" fill="#ffffff" text-anchor="middle">M3</text>
  <text x="849" y="412" font-size="10.5" fill="#dbeafe" text-anchor="middle">编码基线</text>
  <line x1="160" y1="428" x2="160" y2="452" stroke="#6b7280" stroke-width="2"/>
  <polygon points="160,458 155,450 165,450" fill="#6b7280"/>

  <!-- 行5 系统测试 -->
  <rect x="60" y="462" width="200" height="64" rx="8" fill="#059669"/>
  <text x="160" y="482" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">系统测试</text>
  <text x="160" y="500" font-size="10.5" fill="#d1fae5" text-anchor="middle">集成/系统/验收测试</text>
  <text x="160" y="516" font-size="10.5" fill="#d1fae5" text-anchor="middle">缺陷修复与回归</text>
  <rect x="300" y="462" width="260" height="64" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="430" y="492" font-size="12" fill="#374151" text-anchor="middle">《测试报告》</text>
  <text x="430" y="512" font-size="11" fill="#6b7280" text-anchor="middle">缺陷记录、覆盖与结论</text>
  <rect x="610" y="462" width="130" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="675" y="490" font-size="12" fill="#92400e" text-anchor="middle">G5 验收评审</text>
  <text x="675" y="510" font-size="10.5" fill="#92400e" text-anchor="middle">对照需求规格验收</text>
  <rect x="796" y="462" width="106" height="64" rx="8" fill="#1e3a8a"/>
  <text x="849" y="490" font-size="11" fill="#ffffff" text-anchor="middle">M4</text>
  <text x="849" y="510" font-size="10.5" fill="#dbeafe" text-anchor="middle">发布基线</text>
  <line x1="160" y1="526" x2="160" y2="550" stroke="#6b7280" stroke-width="2"/>
  <polygon points="160,556 155,548 165,548" fill="#6b7280"/>

  <!-- 行6 部署维护 -->
  <rect x="60" y="560" width="200" height="50" rx="8" fill="#059669"/>
  <text x="160" y="580" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">部署与维护</text>
  <text x="160" y="598" font-size="10.5" fill="#d1fae5" text-anchor="middle">发布部署、运维监控</text>
  <rect x="300" y="560" width="260" height="50" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="430" y="590" font-size="12" fill="#374151" text-anchor="middle">《可运行系统 + 运维手册》</text>

  <!-- 回退注释 -->
  <text x="40" y="316" font-size="10.5" fill="#dc2626" transform="rotate(-90 40 316)">评审未通过：返回上一阶段重新执行</text>
</svg>
