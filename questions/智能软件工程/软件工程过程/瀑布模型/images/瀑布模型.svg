  </g>
  <line x1="155" y1="194" x2="155" y2="218" stroke="#6b7280" stroke-width="2"/>
  <polygon points="155,224 150,216 160,216" fill="#6b7280"/>

  <g>
    <rect x="50" y="224" width="210" height="52" rx="8" fill="#2563eb"/>
    <text x="155" y="255" font-size="15" fill="#ffffff" text-anchor="middle">详细设计</text>
    <rect x="320" y="224" width="200" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
