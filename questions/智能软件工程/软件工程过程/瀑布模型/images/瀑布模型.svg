    <rect x="320" y="306" width="200" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="420" y="337" font-size="13" fill="#374151" text-anchor="middle">源代码与单元测试</text>
    <line x1="260" y1="332" x2="320" y2="332" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
