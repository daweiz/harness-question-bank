  </g>
  <line x1="155" y1="112" x2="155" y2="136" stroke="#6b7280" stroke-width="2"/>
  <polygon points="155,142 150,134 160,134" fill="#6b7280"/>

  <g>
    <rect x="50" y="142" width="210" height="52" rx="8" fill="#2563eb"/>
