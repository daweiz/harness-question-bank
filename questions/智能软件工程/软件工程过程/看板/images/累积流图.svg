<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <title>看板累积流图（Cumulative Flow Diagram）</title>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">看板累积流图（CFD）</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#6b7280">纵轴为累计工作项数量，条带宽度反映各状态的在制品规模</text>

  <!-- 绘图区 -->
  <g>
    <!-- 待办带（顶部）：从 done+doing 到 total -->
    <polygon points="60,264.1 130,247.6 200,227.1 270,202.4 340,173.5 410,144.7 480,111.8 550,78.8 620,50 620,66.5 550,99.4 480,136.5 410,173.5 340,210.6 270,243.5 200,272.4 130,297.1 60,313.5" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="88" y="278" font-size="11" fill="#1e40af">待办</text>

    <!-- 开发中带（中部）：从 completed 到 done+doing -->
    <polygon points="60,313.5 130,297.1 200,272.4 270,243.5 340,210.6 410,173.5 480,136.5 550,99.4 620,66.5 620,148.8 550,185.9 480,218.8 410,247.6 340,272.4 270,293 200,309.4 130,321.8 60,330" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="88" y="322" font-size="11" fill="#92400e">开发中</text>

    <!-- 完成带（底部）：从基线 330 到 completed -->
    <polygon points="60,330 130,321.8 200,309.4 270,293 340,272.4 410,247.6 480,218.8 550,185.9 620,148.8 620,330" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
    <text x="88" y="341" font-size="11" fill="#14532d">完成</text>

    <!-- 纵轴 -->
    <line x1="60" y1="330" x2="60" y2="40" stroke="#9ca3af" stroke-width="1"/>
    <line x1="60" y1="330" x2="620" y2="330" stroke="#9ca3af" stroke-width="1"/>
    <text x="48" y="334" text-anchor="end" font-size="10" fill="#6b7280">0</text>
    <text x="48" y="214" text-anchor="end" font-size="10" fill="#6b7280">30</text>
    <text x="48" y="94" text-anchor="end" font-size="10" fill="#6b7280">60</text>
    <text x="48" y="166" text-anchor="middle" font-size="11" fill="#6b7280" transform="rotate(-90 26 180)">工作项累计数</text>

    <!-- 横轴 -->
    <text x="340" y="360" text-anchor="middle" font-size="11" fill="#6b7280">时间</text>
    <line x1="620" y1="330" x2="620" y2="40" stroke="#9ca3af" stroke-width="1"/>

    <!-- 标注：条带宽度 = 在制品 -->
    <line x1="600" y1="99" x2="600" y2="66" stroke="#b91c1c" stroke-width="2"/>
    <text x="596" y="92" text-anchor="end" font-size="10" fill="#b91c1c">条带宽度 = 该状态在制品（WIP）</text>
  </g>

  <!-- 图例 -->
  <g font-size="11">
    <rect x="140" y="372" width="12" height="12" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1"/>
    <text x="158" y="382" fill="#374151">待办</text>
    <rect x="240" y="372" width="12" height="12" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
    <text x="258" y="382" fill="#374151">开发中</text>
    <rect x="360" y="372" width="12" height="12" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
    <text x="378" y="382" fill="#374151">完成</text>
  </g>
</svg>
