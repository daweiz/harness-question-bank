<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">智能软件开发平台总体架构</text>

  <!-- 系统边界 -->
  <rect x="130" y="48" width="845" height="560" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="145" y="66" font-size="11" fill="#64748b">平台系统边界</text>

  <!-- A 客户端层 -->
  <text x="32" y="102" font-size="14" font-weight="bold" fill="#1f2937">客户端层</text>
  <rect x="140" y="72" width="220" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="100" text-anchor="middle" font-size="13" fill="#1e3a8a">IDE 插件</text>
  <rect x="420" y="72" width="220" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="530" y="100" text-anchor="middle" font-size="13" fill="#1e3a8a">Web 工作台</text>
  <rect x="700" y="72" width="220" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="810" y="100" text-anchor="middle" font-size="13" fill="#1e3a8a">CLI 工具</text>

  <line x1="450" y1="128" x2="450" y2="178" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- B 接入层 -->
  <text x="32" y="222" font-size="14" font-weight="bold" fill="#1f2937">接入层</text>
  <rect x="300" y="190" width="400" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="500" y="218" text-anchor="middle" font-size="13" fill="#0c4a6e">API 网关（认证 · 限流 · 租户路由 · 协议适配）</text>

  <line x1="450" y1="246" x2="450" y2="296" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- C 应用服务层 -->
  <text x="32" y="340" font-size="14" font-weight="bold" fill="#1f2937">应用服务层</text>
  <rect x="140" y="308" width="150" height="58" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="215" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">会话管理</text>
  <text x="215" y="354" text-anchor="middle" font-size="11" fill="#9d174d">服务</text>
  <rect x="305" y="308" width="150" height="58" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="380" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">上下文</text>
  <text x="380" y="354" text-anchor="middle" font-size="11" fill="#9d174d">聚合服务</text>
  <rect x="470" y="308" width="150" height="58" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="545" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">提示编排</text>
  <text x="545" y="354" text-anchor="middle" font-size="11" fill="#9d174d">服务</text>
  <rect x="635" y="308" width="150" height="58" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="710" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">代码审查</text>
  <text x="710" y="354" text-anchor="middle" font-size="11" fill="#9d174d">服务</text>
  <rect x="800" y="308" width="150" height="58" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="875" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">知识检索</text>
  <text x="875" y="354" text-anchor="middle" font-size="11" fill="#9d174d">服务</text>

  <line x1="450" y1="374" x2="450" y2="424" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D 模型网关层 -->
  <text x="32" y="472" font-size="14" font-weight="bold" fill="#1f2937">模型网关层</text>
  <rect x="140" y="436" width="210" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="245" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">模型路由与容错</text>
  <text x="245" y="482" text-anchor="middle" font-size="11" fill="#14532d">选择 · 超时 · 降级</text>
  <rect x="410" y="436" width="220" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">模型适配器</text>
  <text x="520" y="482" text-anchor="middle" font-size="11" fill="#14532d">多供应商统一接口</text>
  <rect x="690" y="436" width="210" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="795" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">结果缓存与重试</text>
  <text x="795" y="482" text-anchor="middle" font-size="11" fill="#14532d">语义缓存 · 幂等重试</text>

  <line x1="450" y1="492" x2="450" y2="542" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- E 基础设施层 -->
  <text x="32" y="582" font-size="14" font-weight="bold" fill="#1f2937">基础设施层</text>
  <rect x="140" y="554" width="180" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="581" text-anchor="middle" font-size="12" fill="#92400e">向量数据库</text>
  <rect x="360" y="554" width="180" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="581" text-anchor="middle" font-size="12" fill="#92400e">代码仓库索引</text>
  <rect x="580" y="554" width="180" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="670" y="581" text-anchor="middle" font-size="12" fill="#92400e">事件总线</text>
  <rect x="800" y="554" width="150" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="875" y="581" text-anchor="middle" font-size="12" fill="#92400e">监控与日志</text>

  <!-- 横切关注点 -->
  <rect x="140" y="640" width="720" height="50" rx="8" fill="none" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="500" y="672" text-anchor="middle" font-size="13" font-weight="bold" fill="#be123c">横切关注点：安全与租户隔离 · 配置中心 · 全链路可观测性（贯穿各层）</text>
</svg>
