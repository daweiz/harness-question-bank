<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <text x="480" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">预约挂号模块详细设计结构图</text>

  <!-- 分层类结构：控制层 -->
  <text x="40" y="62" font-size="15" font-weight="bold" fill="#1f2937">分层类结构（模块内部结构）</text>
  <rect x="40" y="72" width="880" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#5b21b6">控制层 Controller · AppointmentController</text>
  <text x="480" y="116" font-size="13" text-anchor="middle" fill="#6d28d9">参数校验 · 权限控制 · REST/页面适配</text>

  <line x1="480" y1="124" x2="480" y2="138" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 服务层 -->
  <rect x="40" y="140" width="880" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="480" y="164" font-size="14" font-weight="bold" text-anchor="middle" fill="#075985">服务层 Service · AppointmentService</text>
  <text x="480" y="184" font-size="13" text-anchor="middle" fill="#0c4a6e">业务规则编排 · 号源分配策略（Strategy） · 事务边界</text>

  <line x1="480" y1="192" x2="480" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 领域层 -->
  <rect x="40" y="208" width="880" height="112" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="232" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">领域层 Domain（核心业务规则）</text>
  <rect x="64" y="244" width="272" height="64" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="200" y="266" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">Appointment（聚合根 · 实体）</text>
  <text x="200" y="288" font-size="12" text-anchor="middle" fill="#047857">状态流转 changeStatus · 唯一标识</text>
  <rect x="352" y="244" width="272" height="64" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="488" y="266" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">Slot（值对象）</text>
  <text x="488" y="288" font-size="12" text-anchor="middle" fill="#047857">号源时间 · 可用数 · 不可变</text>
  <rect x="640" y="244" width="256" height="64" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="768" y="266" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">SchedulingPolicy（领域服务）</text>
  <text x="768" y="288" font-size="12" text-anchor="middle" fill="#047857">先到先得 / 优先级分配算法</text>

  <line x1="480" y1="320" x2="480" y2="334" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 数据访问层 -->
  <rect x="40" y="336" width="880" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">数据访问层 Repository · AppointmentRepository</text>
  <text x="480" y="380" font-size="13" text-anchor="middle" fill="#b45309">save · findById · update（依赖倒置，便于替换数据源与 mock 测试）</text>

  <!-- 状态机 -->
  <text x="40" y="424" font-size="15" font-weight="bold" fill="#1f2937">预约状态机（关键业务规则）</text>
  <rect x="40" y="436" width="180" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="130" y="466" font-size="13" font-weight="bold" text-anchor="middle" fill="#075985">可预约（待支付）</text>
  <line x1="224" y1="461" x2="274" y2="461" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="249" y="451" font-size="11" text-anchor="middle" fill="#475569">提交</text>
  <rect x="278" y="436" width="180" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="368" y="466" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">已预约</text>
  <line x1="462" y1="461" x2="512" y2="461" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="487" y="451" font-size="11" text-anchor="middle" fill="#475569">取消</text>
  <rect x="516" y="436" width="150" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="591" y="466" font-size="13" font-weight="bold" text-anchor="middle" fill="#9d174d">已取消</text>
  <line x1="670" y1="461" x2="720" y2="461" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="451" font-size="11" text-anchor="middle" fill="#475569">就诊</text>
  <rect x="724" y="436" width="196" height="50" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="822" y="466" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f766e">已完成</text>

  <!-- 超时关闭虚线回流 -->
  <path d="M 368 486 L 368 512 L 130 512 L 130 490" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
  <text x="249" y="505" font-size="12" text-anchor="middle" fill="#64748b">30 分钟未支付 → 超时自动关闭</text>

  <!-- 关键设计决策 -->
  <rect x="40" y="540" width="880" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="480" y="566" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">关键设计决策：预约幂等（患者 + 就诊日期 + 号源 唯一约束）· 状态机限定合法流转 · 分配策略接口化支持替换</text>
  <text x="480" y="590" font-size="13" text-anchor="middle" fill="#334155">服务层通过策略接口注入具体分配算法 · 仓储依赖倒置使领域层保持持久化无关性，便于单元测试</text>
</svg>
