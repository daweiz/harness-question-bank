<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A90D9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#FFFFFF"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">运费计算模块 · 测试用例设计过程结构图</text>

  <!-- 输入 -->
  <rect x="250" y="50" width="500" height="58" rx="8" fill="#E3F0FB" stroke="#4A90D9" stroke-width="1.4"/>
  <text x="500" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F4E79">测试输入</text>
  <text x="500" y="95" text-anchor="middle" font-size="12" fill="#444444">运费计算需求规格 + 算法接口契约 + 参数与异常定义</text>

  <g stroke="#4A90D9" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M500,108 L500,142"/>
  </g>

  <!-- 测试点分析 -->
  <rect x="250" y="142" width="500" height="58" rx="8" fill="#E3F0FB" stroke="#4A90D9" stroke-width="1.4"/>
  <text x="500" y="164" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F4E79">测试点分析</text>
  <text x="500" y="187" text-anchor="middle" font-size="12" fill="#444444">功能点拆分：计价规则、重量/体积折算、区域价格、优惠叠加、异常分支</text>

  <g stroke="#4A90D9" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M500,200 L500,234"/>
  </g>

  <!-- 方法选择分支 -->
  <text x="500" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79"/>
  <rect x="250" y="234" width="500" height="58" rx="8" fill="#E8F5E9" stroke="#66A05F" stroke-width="1.4"/>
  <text x="500" y="256" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2E7D32">测试方法选择</text>
  <text x="500" y="279" text-anchor="middle" font-size="12" fill="#2E7D32">黑盒：等价类 / 边界值 / 决策表 / 错误推测 ｜ 白盒：语句与分支覆盖</text>

  <g stroke="#4A90D9" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M300,292 L180,320"/>
    <path d="M420,292 L360,320"/>
    <path d="M500,292 L500,320"/>
    <path d="M580,292 L640,320"/>
    <path d="M700,292 L820,320"/>
  </g>

  <!-- 四个方法卡片 -->
  <g>
    <rect x="60"  y="322" width="205" height="140" rx="8" fill="#F5F7FA" stroke="#8A94A6" stroke-width="1.3"/>
    <rect x="285" y="322" width="205" height="140" rx="8" fill="#F5F7FA" stroke="#8A94A6" stroke-width="1.3"/>
    <rect x="510" y="322" width="205" height="140" rx="8" fill="#F5F7FA" stroke="#8A94A6" stroke-width="1.3"/>
    <rect x="735" y="322" width="205" height="140" rx="8" fill="#F5F7FA" stroke="#8A94A6" stroke-width="1.3"/>
  </g>
  <g fill="#333333" text-anchor="middle">
    <text x="162" y="346" font-size="12.5" font-weight="bold">等价类划分</text>
    <text x="387" y="346" font-size="12.5" font-weight="bold">边界值分析</text>
    <text x="612" y="346" font-size="12.5" font-weight="bold">决策表</text>
    <text x="837" y="346" font-size="12.5" font-weight="bold">错误推测 + 白盒覆盖</text>
  </g>
  <g fill="#444444" text-anchor="middle" font-size="11">
    <text x="162" y="370">有效/无效重量区间</text>
    <text x="387" y="370">0、下限、上限、临界</text>
    <text x="612" y="370">条件组合驱动用例</text>
    <text x="837" y="370">经验缺陷 + 语句覆盖</text>
    <text x="162" y="392">区域、价格档位划分</text>
    <text x="387" y="392">超重、超大件边界</text>
    <text x="612" y="392">规则/不适用/例外互斥</text>
    <text x="837" y="392">分支与条件组合覆盖</text>
    <text x="162" y="414">每类取代表值</text>
    <text x="387" y="414">两端及相邻值</text>
    <text x="612" y="414">避免遗漏组合</text>
    <text x="837" y="414">补关键路径用例</text>
  </g>

  <g stroke="#4A90D9" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M500,462 L500,496"/>
  </g>

  <!-- 用例编制 -->
  <rect x="250" y="496" width="500" height="70" rx="8" fill="#FFF8E1" stroke="#D9A825" stroke-width="1.4"/>
  <text x="500" y="518" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7A5B00">测试用例编制</text>
  <text x="500" y="541" text-anchor="middle" font-size="12" fill="#7A5B00">用例要素：编号、前置条件、输入数据、执行步骤、预期结果</text>
  <text x="500" y="559" text-anchor="middle" font-size="12" fill="#7A5B00">单一职责：一个用例验证一个测试点，可复用于回归</text>

  <g stroke="#4A90D9" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M500,566 L500,600"/>
  </g>

  <!-- 优先级与评审 -->
  <rect x="250" y="600" width="500" height="58" rx="8" fill="#F0E6F6" stroke="#8E6BB8" stroke-width="1.4"/>
  <text x="500" y="622" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5B3E86">用例优先级与评审</text>
  <text x="500" y="645" text-anchor="middle" font-size="12" fill="#5B3E86">核心计价路径 P0 优先执行 · 用例交叉评审 · 覆盖率核对与查漏补缺</text>

  <g stroke="#4A90D9" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M500,658 L500,692"/>
  </g>

  <!-- 输出 -->
  <rect x="250" y="692" width="500" height="48" rx="8" fill="#E3F0FB" stroke="#4A90D9" stroke-width="1.4"/>
  <text x="500" y="718" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F4E79">输出：可执行、可追溯、可回归的测试用例集</text>
</svg>
