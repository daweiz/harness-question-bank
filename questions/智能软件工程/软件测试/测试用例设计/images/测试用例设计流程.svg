<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="680" fill="#ffffff"/>
  <text x="380" y="32" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">测试用例设计整体流程：需求分析 → 用例设计 → 级别映射 → 智能增强</text>

  <!-- 阶段 1：需求与规格分析 -->
  <g>
    <rect x="50" y="60" width="300" height="52" rx="8" fill="#2563eb"/>
    <text x="200" y="91" font-size="15" fill="#ffffff" text-anchor="middle">① 需求与规格分析</text>
    <rect x="420" y="60" width="290" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="565" y="83" font-size="13" fill="#374151" text-anchor="middle">梳理业务规则</text>
    <text x="565" y="101" font-size="13" fill="#374151" text-anchor="middle">提取测试条件清单</text>
  </g>
  <line x1="200" y1="112" x2="200" y2="136" stroke="#6b7280" stroke-width="2"/>
  <polygon points="200,142 195,134 205,134" fill="#6b7280"/>

  <!-- 阶段 2：等价类划分 -->
  <g>
    <rect x="50" y="144" width="300" height="52" rx="8" fill="#2563eb"/>
    <text x="200" y="175" font-size="15" fill="#ffffff" text-anchor="middle">② 等价类划分</text>
    <rect x="420" y="144" width="290" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="565" y="167" font-size="13" fill="#374151" text-anchor="middle">有效/无效等价类</text>
    <text x="565" y="185" font-size="13" fill="#374151" text-anchor="middle">每个等价类取代表值</text>
  </g>
  <line x1="200" y1="196" x2="200" y2="220" stroke="#6b7280" stroke-width="2"/>
  <polygon points="200,226 195,218 205,218" fill="#6b7280"/>

  <!-- 阶段 3：边界值分析 -->
  <g>
    <rect x="50" y="228" width="300" height="52" rx="8" fill="#2563eb"/>
    <text x="200" y="259" font-size="15" fill="#ffffff" text-anchor="middle">③ 边界值分析</text>
    <rect x="420" y="228" width="290" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="565" y="251" font-size="13" fill="#374151" text-anchor="middle">边界及邻值取值</text>
    <text x="565" y="269" font-size="13" fill="#374151" text-anchor="middle">补充边界缺陷用例</text>
  </g>
  <line x1="200" y1="280" x2="200" y2="304" stroke="#6b7280" stroke-width="2"/>
  <polygon points="200,310 195,302 205,302" fill="#6b7280"/>

  <!-- 阶段 4：判定表设计 -->
  <g>
    <rect x="50" y="312" width="300" height="52" rx="8" fill="#2563eb"/>
    <text x="200" y="343" font-size="15" fill="#ffffff" text-anchor="middle">④ 判定表设计</text>
    <rect x="420" y="312" width="290" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="565" y="335" font-size="13" fill="#374151" text-anchor="middle">条件组合规则集</text>
    <text x="565" y="353" font-size="13" fill="#374151" text-anchor="middle">消除不可能/冗余组合</text>
  </g>
  <line x1="200" y1="364" x2="200" y2="388" stroke="#6b7280" stroke-width="2"/>
  <polygon points="200,394 195,386 205,386" fill="#6b7280"/>

  <!-- 阶段 5：测试级别映射 -->
  <g>
    <rect x="50" y="396" width="300" height="52" rx="8" fill="#2563eb"/>
    <text x="200" y="427" font-size="15" fill="#ffffff" text-anchor="middle">⑤ 测试级别映射</text>
    <rect x="420" y="396" width="290" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="565" y="419" font-size="13" fill="#374151" text-anchor="middle">单元 / 集成 / 系统</text>
    <text x="565" y="437" font-size="13" fill="#374151" text-anchor="middle">用例分层执行</text>
  </g>
  <line x1="200" y1="448" x2="200" y2="472" stroke="#6b7280" stroke-width="2"/>
  <polygon points="200,478 195,470 205,470" fill="#6b7280"/>

  <!-- 阶段 6：智能测试增强 -->
  <g>
    <rect x="50" y="480" width="300" height="52" rx="8" fill="#059669"/>
    <text x="200" y="511" font-size="15" fill="#ffffff" text-anchor="middle">⑥ 智能测试增强</text>
    <rect x="420" y="480" width="290" height="52" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text x="565" y="503" font-size="13" fill="#065f46" text-anchor="middle">变异测试 / AI 用例生成</text>
    <text x="565" y="521" font-size="13" fill="#065f46" text-anchor="middle">覆盖率与检错能力评估</text>
  </g>

  <text x="380" y="580" font-size="13" fill="#6b7280" text-anchor="middle">等价类、边界值与判定表构成用例设计主线，配合级别分层与智能测试形成闭环</text>
</svg>
